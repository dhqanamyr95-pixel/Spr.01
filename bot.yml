name: Run Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# جلوگیری از اجرای همزمان چند نسخه (که می‌تواند باعث تداخل در offset/دیتابیس شود)
concurrency:
  group: telegram-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot for ~4.5 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: python bot_once.py

      - name: Commit updated database
        run: |
          git config user.name "bot-runner"
          git config user.email "bot-runner@users.noreply.github.com"
          git add bot.db
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push
